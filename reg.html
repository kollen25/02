<!DOCTYPE html>
<html>

<head>
    <title>Smart Timetable</title>
    <h1 text-color: white>Welcome to Smart Timetable Maker</h1>
    <style>

    </style>
</head>

<body>
    <div id="register" class="section" style="display:none;">
        <h2>Регистрация</h2>
        <input type="text" id="regName" placeholder="Имя" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Пароль" required>
        <button onclick="register()">Зарегистрироваться</button>
    </div> 
    <div id="login" class="section" style="display:none;">
        <h2>Вход</h2>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button onclick="login()">Войти</button>
    </div> 
    <div id="feedback" class="section" style="display:none;">
        <h2>Обратная связь</h2>
        <input type="text" id="feedbackName" placeholder="Ваше имя" required>
        <textarea id="feedbackMessage" placeholder="Ваше сообщение..." required></textarea>
        <button onclick="sendFeedback()">Отправить</button>
    </div>
    <script>
    const BASE_URL = "http://localhost:3000";
    let currentUser = null; 
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
        }
        async function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            try {
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                alert(data.message);
                if (response.ok) showSection('login');
            } catch (error) {
                alert('Ошибка при регистрации');
            }
        }
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    currentUser = data.user;
                    localStorage.setItem('token', data.token);
                    alert('Вы вошли как ' + currentUser.name);
                    showSection('dashboard'); 
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Ошибка при входе');
            }
        }
        function logout() {
            currentUser = null;
            localStorage.removeItem('token');
            alert('Вы вышли из системы');
            showSection('login');
        }
        async function sendFeedback() {
            if (!currentUser) {
                alert('Сначала войдите в систему');
                return;
            }
            const name = document.getElementById('feedbackName').value;
            const message = document.getElementById('feedbackMessage').value;
            const token = localStorage.getItem('token');
            try {
                const response = await fetch('http://localhost:5000/api/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, message })
                });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert('Ошибка при отправке обратной связи');
            }
        }</script>
</body>

</html>
